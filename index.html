<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terste's Poop Snake</title>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0b0b14;
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #ff007f, #00f0ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      text-align: center;
    }

    /* Twitch Auth Bar */
    .auth-container {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .twitch-btn {
      background: #9146FF;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 10px rgba(145, 70, 255, 0.5);
      transition: transform 0.2s, background 0.2s;
    }

    .twitch-btn:hover {
      background: #772ce8;
      transform: scale(1.03);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #00f0ff;
    }

    .user-name {
      font-weight: bold;
      color: #00f0ff;
      font-size: 0.95rem;
    }

    .logout-btn {
      background: transparent;
      border: none;
      color: #ff4757;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
      margin-left: 5px;
    }

    .header-scores {
      display: flex;
      gap: 15px;
      font-weight: bold;
      font-size: 1.05rem;
      margin-bottom: 8px;
    }

    .score-box {
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .score-box span {
      color: #00f0ff;
    }

    #status-bar {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 8px;
      width: 100%;
      max-width: 420px;
      border-radius: 8px;
      transition: all 0.3s ease;
      text-align: center;
    }

    .status-idle {
      color: #777899;
      font-style: italic;
    }

    .status-clown {
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8b00ff);
      color: #fff;
      text-shadow: 0 1px 3px #000;
      animation: pulse 0.8s infinite alternate;
    }

    .status-fog {
      background: rgba(139, 0, 255, 0.4);
      color: #ff00ff;
      border: 1px solid #ff00ff;
      text-shadow: 0 0 8px #ff00ff;
    }

    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.9; }
      100% { transform: scale(1.02); opacity: 1; }
    }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      background: #101021;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.8);
      border: 2px solid rgba(0, 240, 255, 0.3);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 22, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    .overlay-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 10px #00f0ff;
    }

    .start-btn {
      background: linear-gradient(135deg, #00f0ff, #8b00ff);
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: btnPulse 1.5s infinite;
    }

    .start-btn:hover, .start-btn:active {
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.9);
    }

    @keyframes btnPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .toggles {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      width: 100%;
      max-width: 420px;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .toggle-btn.active {
      background: linear-gradient(135deg, #ff007f, #8b00ff);
      border-color: #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 55px);
      grid-template-rows: repeat(3, 55px);
      gap: 8px;
      margin-top: 12px;
    }

    .dbtn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: #fff;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .dbtn:active {
      background: #00f0ff;
      color: #000;
    }

    .dbtn-up { grid-column: 2; grid-row: 1; }
    .dbtn-left { grid-column: 1; grid-row: 2; }
    .dbtn-down { grid-column: 2; grid-row: 3; }
    .dbtn-right { grid-column: 3; grid-row: 2; }

    /* Leaderboard Styles */
    .leaderboard-box {
      width: 100%;
      max-width: 420px;
      margin-top: 20px;
      background: rgba(16, 16, 33, 0.9);
      border-radius: 12px;
      border: 1px solid rgba(0, 240, 255, 0.2);
      padding: 12px;
    }

    .leaderboard-title {
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #00f0ff;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .leaderboard-user {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .leaderboard-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
    }

    .leaderboard-score {
      font-weight: bold;
      color: #ff007f;
    }

    footer {
      margin-top: 20px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: bold;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    footer span {
      color: #00f0ff;
    }
  </style>
</head>

  <h1>Terste's Poop Snake</h1>

  <!-- Twitch Auth Box -->
  <div class="auth-container">

      <button class="twitch-btn" onclick="loginWithTwitch()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.571zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
        Mit Twitch Anmelden
      </button>
    </div>
    <div id="auth-logged-in" style="display: none;">

  <div class="canvas-container">
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="overlay">
      <div class="overlay-title" id="overlay-title">TERSTE'S POOP SNAKE</div>
      <button class="start-btn" id="start-btn" onclick="startGame()">🎮 SPIEL STARTEN</button>

  <div class="toggles">

  <div class="dpad">

  <!-- Globale Bestenliste -->
  <div class="leaderboard-box">
    <div class="leaderboard-title">🏆 Globale Bestenliste</div>
    <div id="leaderboard-list" class="leaderboard-list">
      <div style="text-align: center; color: #777;">Lade Highscores...</div>
    </div>
  </div>

  <footer>POWERED BY <span>WELLIOO</span></footer>

  <script>
    // --- SUPABASE CONFIG ---
    const SUPABASE_URL = 'https://dneqgwkqxdwigbemovob.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qBFPrNI61oVzzkr86snBgg_orBQfDbD';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    // Auth Status Check beim Laden
    async function initAuth() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        currentUser = user;
        showLoggedInUser();
      }
      fetchLeaderboard();
    }

    function loginWithTwitch() {
      supabaseClient.auth.signInWithOAuth({
        provider: 'twitch',
        options: {
          redirectTo: 'https://terste-poop-snake.vercel.app'
        }
      });
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      document.getElementById('auth-logged-out').style.display = 'block';
      document.getElementById('auth-logged-in').style.display = 'none';
    }

    function showLoggedInUser() {
      if (!currentUser) return;
      const meta = currentUser.user_metadata;
      const name = meta.custom_claims?.global_name || meta.name || meta.full_name || 'Spieler';
      const avatar = meta.avatar_url || 'https://abs.twimg.com/sticky/default_profile_images/default_profile_normal.png';

      document.getElementById('user-display-name').innerText = name;
      document.getElementById('user-avatar-img').src = avatar;

      document.getElementById('auth-logged-out').style.display = 'none';
      document.getElementById('auth-logged-in').style.display = 'block';
    }

    // Highscore in Supabase speichern
    async function saveHighscoreToSupabase(finalScore) {
      if (!currentUser || finalScore <= 0) return;

      const meta = currentUser.user_metadata;
      const username = meta.custom_claims?.global_name || meta.name || meta.full_name || 'Unbekannt';
      const avatar_url = meta.avatar_url || '';

      await supabaseClient
        .from('highscores')
        .insert([{ username, avatar_url, score: finalScore }]);

      fetchLeaderboard();
    }

    // Highscores laden & anzeigen
    async function fetchLeaderboard() {
      const { data, error } = await supabaseClient
        .from('highscores')
        .select('*')
        .order('score', { ascending: false })
        .limit(10);

      const listEl = document.getElementById('leaderboard-list');
      if (error || !data || data.length === 0) {
        listEl.innerHTML = '<div style="text-align: center; color: #777;">Noch keine Highscores vorhanden!</div>';
        return;
      }

      listEl.innerHTML = data.map((item, index) => `
        <div class="leaderboard-item">
          <div class="leaderboard-user">
            <span style="font-weight:bold; color:#00f0ff; width:18px;">${index + 1}.</span>
            ${item.avatar_url ? `<img class="leaderboard-avatar" src="${item.avatar_url}">` : ''}
            <span>${escapeHtml(item.username)}</span>
          </div>
          <div class="leaderboard-score">${item.score} PTS</div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    initAuth();

    // --- GAME ENGINE ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CELL_COUNT = 20;
    const CELL_PX = canvas.width / CELL_COUNT;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };

    let score = 0;
    let highscore = localStorage.getItem('poop_snake_hs') || 0;
    document.getElementById('highscore').innerText = highscore;

    let items = [];
    let isRunning = false;
    let gameLoopTimeout = null;

    let clownMode = false;
    let clownTimer = 0;
    let clownInterval = null;

    let fogMode = false;
    let cloudParticles = [];
    let lightsAngle = 0;

    for (let i = 0; i < 12; i++) {
      cloudParticles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: 60 + Math.random() * 50,
        dx: (Math.random() - 0.5) * 2.5,
        dy: (Math.random() - 0.5) * 1.5
      });
    }

    function toggleFog() {
      fogMode = !fogMode;
      document.getElementById('fog-btn').classList.toggle('active', fogMode);
      updateStatus();
    }

    function updateStatus() {
      const statusBar = document.getElementById('status-bar');
      if (clownMode) {
        statusBar.className = 'status-clown';
        statusBar.innerText = `🤡 CLOWNSFIESTA! UNVERWUNDBAR (${clownTimer}s)`;
      } else if (fogMode) {
        statusBar.className = 'status-fog';
        statusBar.innerText = '🌬️ NEBELMASCHINE & TANZPARTY AKTIV (1.5x)';
      } else {
        statusBar.className = 'status-idle';
        statusBar.innerText = 'Steuerung: WASD / Pfeiltasten / Touch-Pad';
      }
    }

    function startGame() {
      snake = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      document.getElementById('score').innerText = score;

      clownMode = false;
      if (clownInterval) clearInterval(clownInterval);
      updateStatus();

      spawnItems();
      document.getElementById('overlay').style.display = 'none';
      isRunning = true;

      if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
      tick();
    }

    function spawnItems() {
      items = [];
      items.push({ ...getRandomPos(), type: 'poop' });
      if (Math.random() < 0.4) items.push({ ...getRandomPos(), type: 'toilet' });
      if (Math.random() < 0.25) items.push({ ...getRandomPos(), type: 'clown' });
    }

    function getRandomPos() {
      let pos;
      while (true) {
        pos = {
          x: Math.floor(Math.random() * CELL_COUNT),
          y: Math.floor(Math.random() * CELL_COUNT)
        };
        if (!snake.some(s => s.x === pos.x && s.y === pos.y)) break;
      }
      return pos;
    }

    function setDir(x, y) {
      if (!isRunning) return;
      if (x !== -dir.x || y !== -dir.y) {
        nextDir = { x, y };
      }
    }

    window.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': setDir(0, -1); break;
        case 'ArrowDown': case 's': case 'S': setDir(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': setDir(1, 0); break;
      }
    });

    function tick() {
      if (!isRunning) return;

      dir = { ...nextDir };
      let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0) head.x = CELL_COUNT - 1;
      if (head.x >= CELL_COUNT) head.x = 0;
      if (head.y < 0) head.y = CELL_COUNT - 1;
      if (head.y >= CELL_COUNT) head.y = 0;

      if (!clownMode) {
        for (let i = 0; i < snake.length; i++) {
          if (snake[i].x === head.x && snake[i].y === head.y) {
            gameOver();
            return;
          }
        }
      }

      snake.unshift(head);

      let ate = false;
      const mult = fogMode ? 1.5 : 1.0;

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        if (item.x === head.x && item.y === head.y) {
          ate = true;
          if (item.type === 'poop') {
            score += Math.round(10 * mult);
          } else if (item.type === 'toilet') {
            score += Math.round(15 * mult);
            if (snake.length > 4) snake.pop();
          } else if (item.type === 'clown') {
            score += Math.round(20 * mult);
            triggerClownFiesta();
          }
          document.getElementById('score').innerText = score;
          spawnItems();
          break;
        }
      }

      if (!ate) snake.pop();

      draw();
      gameLoopTimeout = setTimeout(tick, fogMode ? 80 : 120);
    }

    function triggerClownFiesta() {
      clownMode = true;
      clownTimer = 10;
      updateStatus();

      if (clownInterval) clearInterval(clownInterval);
      clownInterval = setInterval(() => {
        clownTimer--;
        updateStatus();
        if (clownTimer <= 0) {
          clearInterval(clownInterval);
          clownMode = false;
          updateStatus();
        }
      }, 1000);
    }

    function gameOver() {
      isRunning = false;

      if (score > highscore) {
        highscore = score;
        localStorage.setItem('poop_snake_hs', highscore);
        document.getElementById('highscore').innerText = highscore;
      }

      saveHighscoreToSupabase(score);

      document.getElementById('overlay-title').innerText = 'GAME OVER!';
      document.getElementById('start-btn').innerText = '🔄 NOCHMAL SPIELEN';
      document.getElementById('overlay').style.display = 'flex';
    }

    function draw() {
      ctx.fillStyle = '#101021';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i < CELL_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_PX, 0); ctx.lineTo(i * CELL_PX, canvas.height); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL_PX); ctx.lineTo(canvas.width, i * CELL_PX); ctx.stroke();
      }

      if (fogMode) {
        lightsAngle += 0.04;
        const colors = ['rgba(255,0,127,0.18)', 'rgba(0,240,255,0.18)', 'rgba(255,230,0,0.18)'];
        for (let i = 0; i < 3; i++) {
          const angle = lightsAngle + (i * Math.PI * 2) / 3;
          const lx = canvas.width / 2 + Math.cos(angle) * 180;
          const ly = canvas.height / 2 + Math.sin(angle) * 180;
          const grad = ctx.createRadialGradient(lx, ly, 10, lx, ly, 160);
          grad.addColorStop(0, colors[i]);
          grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(lx, ly, 160, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      items.forEach(item => {
        const cx = item.x * CELL_PX + CELL_PX / 2;
        const cy = item.y * CELL_PX + CELL_PX / 2;
        ctx.font = `${CELL_PX * 0.75}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 12;
        ctx.shadowColor = item.type === 'poop' ? '#ff9900' : item.type === 'toilet' ? '#00f0ff' : '#ff007f';
        ctx.fillText(item.type === 'poop' ? '💩' : item.type === 'toilet' ? '🚽' : '🤡', cx, cy);
        ctx.shadowBlur = 0;
      });

      const now = Date.now() / 200;
      snake.forEach((seg, idx) => {
        const cx = seg.x * CELL_PX + CELL_PX / 2;
        const cy = seg.y * CELL_PX + CELL_PX / 2;
        const radius = (CELL_PX / 2) * (idx === 0 ? 0.9 : 0.8);

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);

        if (clownMode) {
          const hue = (now * 100 + idx * 25) % 360;
          ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
          ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
          ctx.shadowBlur = 15;
        } else {
          const grad = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, radius);
          if (idx === 0) {
            grad.addColorStop(0, '#00ffff');
            grad.addColorStop(1, '#0088ff');
            ctx.shadowColor = '#00f0ff';
          } else {
            grad.addColorStop(0, '#8b00ff');
            grad.addColorStop(1, '#4b0082');
            ctx.shadowColor = '#8b00ff';
          }
          ctx.fillStyle = grad;
          ctx.shadowBlur = 10;
        }

        ctx.fill();
        ctx.shadowBlur = 0;

        if (idx === 0) {
          ctx.fillStyle = '#fff';
          let eyeOffsetX = dir.x * 5;
          let eyeOffsetY = dir.y * 5;
          ctx.beginPath();
          ctx.arc(cx + eyeOffsetX - dir.y * 5, cy + eyeOffsetY + dir.x * 5, 3.5, 0, Math.PI * 2);
          ctx.arc(cx + eyeOffsetX + dir.y * 5, cy + eyeOffsetY - dir.x * 5, 3.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.arc(cx + eyeOffsetX - dir.y * 5, cy + eyeOffsetY + dir.x * 5, 1.8, 0, Math.PI * 2);
          ctx.arc(cx + eyeOffsetX + dir.y * 5, cy + eyeOffsetY - dir.x * 5, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      if (fogMode) {
        cloudParticles.forEach(cloud => {
          cloud.x += cloud.dx;
          cloud.y += cloud.dy;
          if (cloud.x < -cloud.r) cloud.x = canvas.width + cloud.r;
          if (cloud.x > canvas.width + cloud.r) cloud.x = -cloud.r;
          if (cloud.y < -cloud.r) cloud.y = canvas.height + cloud.r;
          if (cloud.y > canvas.height + cloud.r) cloud.y = -cloud.r;

          const grad = ctx.createRadialGradient(cloud.x, cloud.y, 10, cloud.x, cloud.y, cloud.r);
          grad.addColorStop(0, 'rgba(230, 230, 250, 0.75)');
          grad.addColorStop(0.5, 'rgba(180, 180, 220, 0.45)');
          grad.addColorStop(1, 'rgba(16, 16, 33, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(cloud.x, cloud.y, cloud.r, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }

    draw();
  </script>
</body>
