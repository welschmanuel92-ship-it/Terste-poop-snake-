<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terste's Poop Snake</title>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0b0b14;
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 15px 10px;
      overflow-x: hidden;
    }

    /* Outer 3-Column Layout */
    .layout-wrapper {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 440px;
      flex-shrink: 0;
    }

    /* Desktop Sidebars for Sticker Wall */
    .sidebar {
      display: none; /* Auf Mobilgeräten ausgeblendet */
      flex-direction: column;
      gap: 12px;
      width: 260px;
      flex-shrink: 0;
      position: sticky;
      top: 10px;
    }

    @media (min-width: 1024px) {
      .sidebar {
        display: flex;
      }
    }

    /* Brand Header Box */
    .brand-card {
      background: rgba(16, 16, 33, 0.95);
      border: 2px solid rgba(0, 240, 255, 0.4);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
      margin-bottom: 10px;
    }

    .logos-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 6px;
    }

    .terste-logo-svg {
      width: 42px;
      height: 42px;
      filter: drop-shadow(0 0 8px rgba(255, 0, 127, 0.6));
    }

    .twitch-logo-svg {
      width: 36px;
      height: 36px;
      color: #9146FF;
      filter: drop-shadow(0 0 8px rgba(145, 70, 255, 0.6));
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      color: #00f0ff;
      text-transform: uppercase;
    }

    /* Sticker Card Design */
    .sticker-card {
      position: relative;
      background: #16162a;
      border-radius: 16px;
      border: 3px solid rgba(255, 255, 255, 0.85);
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 240, 255, 0.2);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, z-index 0.3s ease;
      z-index: 1;
      margin-bottom: 4px;
    }

    .sticker-card:hover {
      transform: scale(1.1) rotate(0deg) !important;
      z-index: 25;
      border-color: #00f0ff;
      box-shadow: 0 15px 35px rgba(0, 240, 255, 0.6);
    }

    /* Individual Sticker Rotations */
    .rot-left-1  { transform: rotate(-7deg); }
    .rot-left-2  { transform: rotate(6deg); }
    .rot-left-3  { transform: rotate(-10deg); }
    .rot-left-4  { transform: rotate(5deg); }

    .rot-right-1 { transform: rotate(8deg); }
    .rot-right-2 { transform: rotate(-9deg); }
    .rot-right-3 { transform: rotate(7deg); }
    .rot-right-4 { transform: rotate(-6deg); }

    .img-crop-container {
      width: 100%;
      height: 160px;
      overflow: hidden;
      position: relative;
      background: #05050a;
    }

    .img-crop {
      position: absolute;
      pointer-events: none;
    }

    /* Zooms to hide Overlay Texts */
    .img-smile {
      width: 145%;
      height: 145%;
      object-fit: cover;
      object-position: 50% 25%;
      top: -18%;
      left: -18%;
    }

    .img-princess {
      width: 110%;
      height: 140%;
      object-fit: cover;
      object-position: center top;
      top: -5%;
      left: -5%;
    }

    .img-clown {
      width: 125%;
      height: 125%;
      object-fit: cover;
      object-position: center 30%;
      top: -8%;
      left: -12%;
    }

    .card-caption {
      padding: 6px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: bold;
      color: #fff;
      background: rgba(10, 10, 22, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      letter-spacing: 0.5px;
    }

    .twitch-link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #9146FF, #6441a5);
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 0 15px rgba(145, 70, 255, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 8px;
    }

    .twitch-link-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(145, 70, 255, 0.8);
    }

    /* Main Game UI */
    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #ff007f, #00f0ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      text-align: center;
    }

    .auth-container {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .twitch-btn {
      background: #9146FF;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 10px rgba(145, 70, 255, 0.5);
      transition: transform 0.2s, background 0.2s;
    }

    .twitch-btn:hover {
      background: #772ce8;
      transform: scale(1.03);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #00f0ff;
    }

    .user-name {
      font-weight: bold;
      color: #00f0ff;
      font-size: 0.95rem;
    }

    .logout-btn {
      background: transparent;
      border: none;
      color: #ff4757;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
      margin-left: 5px;
    }

    .header-scores {
      display: flex;
      gap: 15px;
      font-weight: bold;
      font-size: 1.05rem;
      margin-bottom: 8px;
    }

    .score-box {
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .score-box span {
      color: #00f0ff;
    }

    #status-bar {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 8px;
      width: 100%;
      max-width: 420px;
      border-radius: 8px;
      transition: all 0.3s ease;
      text-align: center;
    }

    .status-idle {
      color: #777899;
      font-style: italic;
    }

    .status-clown {
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8b00ff);
      color: #fff;
      text-shadow: 0 1px 3px #000;
      animation: pulse 0.8s infinite alternate;
    }

    .status-fog {
      background: rgba(139, 0, 255, 0.4);
      color: #ff00ff;
      border: 1px solid #ff00ff;
      text-shadow: 0 0 8px #ff00ff;
    }

    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.9; }
      100% { transform: scale(1.02); opacity: 1; }
    }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      background: #101021;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.8);
      border: 2px solid rgba(0, 240, 255, 0.3);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 22, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    .overlay-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 10px #00f0ff;
    }

    .start-btn {
      background: linear-gradient(135deg, #00f0ff, #8b00ff);
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: btnPulse 1.5s infinite;
    }

    .start-btn:hover, .start-btn:active {
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.9);
    }

    @keyframes btnPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .toggles {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      width: 100%;
      max-width: 420px;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .toggle-btn.active {
      background: linear-gradient(135deg, #ff007f, #8b00ff);
      border-color: #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 55px);
      grid-template-rows: repeat(3, 55px);
      gap: 8px;
      margin-top: 12px;
    }

    .dbtn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: #fff;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .dbtn:active {
      background: #00f0ff;
      color: #000;
    }

    .dbtn-up { grid-column: 2; grid-row: 1; }
    .dbtn-left { grid-column: 1; grid-row: 2; }
    .dbtn-down { grid-column: 2; grid-row: 3; }
    .dbtn-right { grid-column: 3; grid-row: 2; }

    /* Leaderboard Styles */
    .leaderboard-box {
      width: 100%;
      max-width: 420px;
      margin-top: 20px;
      background: rgba(16, 16, 33, 0.9);
      border-radius: 12px;
      border: 1px solid rgba(0, 240, 255, 0.2);
      padding: 12px;
    }

    .leaderboard-title {
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #00f0ff;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .leaderboard-user {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .leaderboard-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
    }

    .leaderboard-score {
      font-weight: bold;
      color: #ff007f;
    }

    footer {
      margin-top: 20px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: bold;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
      text-align: center;
    }

    footer span {
      color: #00f0ff;
    }
  </style>
</head>
